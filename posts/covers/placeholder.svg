<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Stand-in cover until a post has a real photo. Neutral gray
       at low opacity, so it sits on either theme's card color. -->
  <defs>
    <pattern id="s" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="16" height="32" fill="#808080" fill-opacity="0.09"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#808080" fill-opacity="0.08"/>
  <rect width="800" height="600" fill="url(#s)"/>
  <text x="400" y="310" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#808080" fill-opacity="0.85">cover photo</text>
</svg>
