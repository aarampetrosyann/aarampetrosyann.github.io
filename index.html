html, body { height: 100%; }
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  overflow-x: hidden;
}
.ascii {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: -2;           /* behind everything, even the patch behind the words */
}

/* Top left: name, a bar, the logo */
.cs-top {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0.9rem;
  padding: 1.75rem 2rem;
}
.cs-top b {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: -0.01em;
}
.cs-bar { width: 1px; height: 1.1rem; background: var(--muted); }
/* the logo is a mask over the text color, so it follows the theme */
.cs-logo {
  width: 1.6rem;
  aspect-ratio: 100 / 98;
  background: var(--ink);
  -webkit-mask: url("icons/logo.svg") no-repeat center / contain;
          mask: url("icons/logo.svg") no-repeat center / contain;
}

/* Center: the message and the contact links */
.cs {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem 5rem;
  text-align: center;
}
/* a soft patch of page color behind the words, so the characters
   never fight with the text */
.cs::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(44rem, 100vw);
  height: 24rem;
  transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, var(--paper) 35%, transparent);
  z-index: -1;
}
.cs h1 {

  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(3rem, 11vw, 6rem);
  line-height: 1;
  letter-spacing: -0.035em;
}
.cs-sub { margin: 1rem 0 0; font-size: 1.1rem; color: var(--muted); }
.cs-rule { width: 1px; height: 2.75rem; margin: 2.25rem 0; background: var(--line); }
.cs-reach { margin: 0 0 1rem; font-size: 1.05rem; }
.cs-links { list-style: none; display: flex; gap: 0.6rem; margin: 0; padding: 0; }
.cs-links a {
  display: grid;
  place-items: center;
  width: 2.6rem;
  height: 2.6rem;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--paper);
  color: var(--ink);
  transition: border-color 0.15s, transform 0.15s;
}
.cs-links a:hover { border-color: var(--ink); transform: translateY(-2px); }
.cs-links svg { width: 1.05rem; height: 1.05rem; fill: currentColor; }

@media (max-width: 560px) {
  .cs-top { padding: 1.25rem 1.25rem; }
}
@media (prefers-reduced-motion: reduce) {
  .cs-links a { transition: none; }
}

<script>
/* ASCII field: a grid of characters, each fading in and out on its
   own slow rhythm, brightest in a glow near the top center and gone
   by the edges. A character swaps for another while it's faded out,
   so the field keeps changing. Drawn in the page's text color, so it
   follows the theme; holds still for reduced motion. */
(function () {
  var canvas = document.getElementById("ascii");
  var ctx = canvas.getContext("2d");
  var CHARS = ".:-=+*~^<>/\\|()[]{}#%&@$";
  var FONT = 13, CELL_W = 11, CELL_H = 16;
  var cols, rows, w, h, cells;
  var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function size() {
    var dpr = window.devicePixelRatio || 1;
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(w / CELL_W);
    rows = Math.ceil(h / CELL_H);

    // Each cell: how strong the glow is there, and its own speed,
    // phase and character.
    var cx = w / 2, cy = h * 0.38, reach = Math.max(w * 0.4, h * 0.5);
    cells = [];
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var x = c * CELL_W, y = r * CELL_H;
        var d = Math.hypot((x - cx) * 0.85, (y - cy) * 1.2) / reach;
        var glow = Math.max(0, 1 - d);
        if (glow < 0.02) continue;
        cells.push({
          x: x, y: y,
          glow: glow * glow * glow,
          speed: 0.25 + Math.random() * 0.9,
          phase: Math.random() * Math.PI * 2,
          ch: CHARS[Math.floor(Math.random() * CHARS.length)],
          wasLow: false
        });
      }
    }
  }

  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    ctx.font = FONT + "px ui-monospace, 'SF Mono', Menlo, Consolas, monospace";
    ctx.textBaseline = "top";
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
    for (var i = 0; i < cells.length; i++) {
      var q = cells[i];
      var wave = 0.5 + 0.5 * Math.sin(t * q.speed + q.phase);
      var a = q.glow * wave * wave * 0.42;
      if (a < 0.015) {
        if (!q.wasLow) {               // faded out: come back as a new character
          q.ch = CHARS[Math.floor(Math.random() * CHARS.length)];
          q.wasLow = true;
        }
        continue;
      }
      q.wasLow = false;
      ctx.globalAlpha = a;
      ctx.fillText(q.ch, q.x, q.y);
    }
    ctx.globalAlpha = 1;
  }

  // About 20 frames a second is plenty for a slow fade, and cheap.
  var last = 0;
  function frame(now) {
    if (now - last > 50) { last = now; draw(now / 1000); }
    requestAnimationFrame(frame);
  }

  size();
  window.addEventListener("resize", function () { size(); if (still) draw(2); });
  // Redraw when the theme changes, since the color comes from it.
  new MutationObserver(function () { if (still) draw(2); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (still) draw(2); else requestAnimationFrame(frame);
})();
</script>
