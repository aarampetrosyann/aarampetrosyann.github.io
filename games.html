<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games | Aram</title>
<meta name="description" content="Small daily-puzzle style browser games built by Aram. Free to play, no sign up.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128225;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<!-- Applies saved theme before paint, then builds the settings panel -->
<script src="settings.js"></script>

<style>
/* Game tiles: square boxes, each in its game's color, with the
   game's icon in the center and its name in the bottom left.
   Colors are tokens in styles.css, icons live in icons/. */
.games {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
}
.games a {
  position: relative;
  aspect-ratio: 1;
  display: flex;
  align-items: flex-end;
  padding: 1rem 1.1rem;
  border-radius: 4px;
  background: var(--tile);
  color: var(--tile-ink);
  font-family: var(--display);
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.1;
  text-decoration: none;
  transition: transform 0.2s ease;
}
.games a:hover { transform: translateY(-3px); }
.games img {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 45%;
  height: auto;
  transform: translate(-50%, -50%);
}
@media (prefers-reduced-motion: reduce) {
  .games a { transition: none; }
  .games a:hover { transform: none; }
}

.games .takuzu  { --tile: var(--game-takuzu);  --tile-ink: var(--game-takuzu-ink); }
.games .kakuro  { --tile: var(--game-kakuro);  --tile-ink: var(--game-kakuro-ink); }
.games .shikaku { --tile: var(--game-shikaku); --tile-ink: var(--game-shikaku-ink); }

@media (max-width: 560px) {
  .games { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

<body>

<!-- The two vertical rules of the drafting grid -->
<div class="page-rules" aria-hidden="true"></div>
<div class="wrap">

<!-- NAV: same as index.html. Keep the three copies in sync. -->
<nav aria-label="Main">
  <a class="home" href="index.html" data-hover-text="[Aram Petrosyan]">[AP]</a>
  <ul>
    <li><a href="games.html" aria-current="page">Games</a></li>
    <li><a href="blog.html">Blog</a></li>
    <li><a href="index.html#experience">Experience</a></li>
    <li><a href="index.html#projects">Projects</a></li>
    <li><a href="index.html#contact">Contact</a></li>
    <li><a href="#" id="settings-btn" class="no-scramble" aria-haspopup="dialog" aria-expanded="false">[...]</a></li>
  </ul>
</nav>

<!-- PAGE HEADER -->
<header class="page-head">
  <h1>Games</h1>
  <p>Small browser puzzles I build for fun. No sign up, no app, just open one and play.</p>
</header>

<main>
<!-- ============================================================
     GAME LIST
     Each game is one <li> with a square tile. To add one:

     1. Add its two color tokens to section 1 of styles.css:
          --game-name:     #......;  (box color)
          --game-name-ink: #......;  (text color on it)
     2. Add a matching line to the <style> block above:
          .games .name { --tile: var(--game-name); --tile-ink: var(--game-name-ink); }
     3. Copy this template:

     <li><a class="name" href="games/name/index.html"><img src="icons/name.png" alt="">Name</a></li>

     Put each game in its own folder: games/name/index.html
     and its icon (a square PNG) at icons/name.png
     ============================================================ -->
<section aria-labelledby="games-h">
  <h2 id="games-h">Play</h2>
  <ul class="games">
    <li><a class="takuzu" href="games/takuzu/index.html"><img src="icons/takuzu.png" alt="">Takuzu</a></li>
    <li><a class="kakuro" href="games/kakuro/index.html"><img src="icons/kakuro.png" alt="">Kakuro</a></li>
    <li><a class="shikaku" href="games/shikaku/index.html"><img src="icons/shikaku.png" alt="">Shikaku</a></li>
  </ul>
</section>

<!-- Delete this section once you have a few games up. -->
<section aria-labelledby="soon-h">
  <h2 id="soon-h">In progress</h2>
  <p class="note">More on the way. If you have an idea for one, <a href="index.html#contact">send it over</a>.</p>
</section>

</main>

<footer>
  <p><a href="index.html">Back to home</a></p>
</footer>

</div>

<!-- Hover scramble effect on the nav links -->
<script src="scramble.js"></script>
<script src="navpanel.js"></script>
<script src="marks.js"></script>
</body>
</html>
